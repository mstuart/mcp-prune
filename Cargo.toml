[package]
name = "mcp-pulse"
version = "0.1.0"
edition = "2021"
description = "Audit MCP server usage from Claude Code transcripts. Find idle servers."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
dirs = "5"
rayon = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
