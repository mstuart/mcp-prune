[package]
name = "mcp-pulse"
version = "0.1.0"
edition = "2021"
authors = ["Mark Stuart <mstuart@users.noreply.github.com>"]
description = "Audit MCP server usage from Claude Code transcripts. Find idle servers to disable."
license = "MIT"
readme = "README.md"
repository = "https://github.com/mstuart/mcp-pulse"
homepage = "https://github.com/mstuart/mcp-pulse"
documentation = "https://github.com/mstuart/mcp-pulse#readme"
keywords = ["mcp", "claude-code", "anthropic", "audit", "telemetry"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
dirs = "5"
rayon = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
